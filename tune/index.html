<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tune — Record Label Simulator Web</title>
    <link rel="stylesheet" href="/src/styles/shared.css" />
  </head>
  <body class="page page--tune">
    <header class="tune-header">
      <a class="back-link" href="/">← Back to city view</a>
      <h1>Remote Config tuner</h1>
      <p class="lede">
        Adjust live numbers for the web host. In-app defaults keep the page
        readable when Firebase is unreachable.
      </p>
    </header>
    <main class="tune-main">
      <form id="tune-form" class="tune-form">
        <label class="field">
          <span>Label title</span>
          <input id="label-title" name="label_title" type="text" required />
        </label>
        <label class="field">
          <span>Tempo</span>
          <input id="tempo" name="tempo" type="number" min="40" max="240" step="1" required />
        </label>
        <label class="field">
          <span>Quality (display number)</span>
          <input id="quality" name="quality" type="number" min="0" max="100" step="1" required />
        </label>
        <button type="submit" class="btn btn--primary">Save</button>
      </form>
      <p id="tune-status" class="tune-status" role="status"></p>
      <p id="tune-auth-note" class="tune-note"></p>
    </main>
    <script type="module" src="/src/tune.js"></script>
  </body>
</html>
